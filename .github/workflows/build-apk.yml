name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Pakai Gradle dari runner (bukan ./gradlew) supaya repo tidak perlu
      # menyimpan gradle-wrapper.jar. Kalau nanti mau build lokal, buka
      # proyek ini di Android Studio — Studio akan membuatkan wrapper-nya.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Build release APK
        # Kalau secret signing belum diisi, buildTypes.release otomatis
        # jatuh ke debug key sehingga langkah ini tetap berhasil.
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: trialfetch-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: trialfetch-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
