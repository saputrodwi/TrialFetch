name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Pakai Gradle dari runner (bukan ./gradlew) supaya repo tidak perlu
      # menyimpan gradle-wrapper.jar. Kalau nanti mau build lokal, buka
      # proyek ini di Android Studio — Studio akan membuatkan wrapper-nya.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # ---------------------------------------------------------------
      # Keystore
      #
      # Kalau secret TF_STORE_BASE64 terpasang, app/build.gradle.kts akan
      # mendecode-nya ke build/signing/keystore.<ext> lalu menandatangani
      # APK dengan key itu. Kalau belum terpasang, build otomatis jatuh ke
      # debug key — pipeline tetap hijau dan APK-nya tetap bisa diuji.
      #
      # Cara memasangnya (Settings > Secrets and variables > Actions):
      #   TF_STORE_BASE64   = isi file keystore-mu, di-encode base64
      #                       satu baris (JKS maupun PKCS#12):
      #                         base64 -w 0 keystore.jks
      #   TF_STORE_EXT      = "jks" (default) atau "p12". WAJIB cocok dengan
      #                       format file aslinya — Gradle membaca format
      #                       dari ekstensi, jadi JKS yang diberi ekstensi
      #                       .p2 akan ditolak saat signing.
      #   TF_STORE_PASSWORD = password store
      #   TF_KEY_ALIAS      = alias kunci, mis. "trial-fetch"
      #   TF_KEY_PASSWORD   = password kunci itu
      #
      # build/signing/ sudah masuk .gitignore, jadi file hasil decode
      # tidak akan ikut ter-commit kalaupun langkah ini gagal.
      # ---------------------------------------------------------------

      # Test duluan supaya test yang gagal tidak menyusul setelah build
      # debug+release habis waktu (dan biar kegagalan terlihat paling awal).
      - name: Unit test (JVM)
        run: gradle :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      # Secret dipetakan sebagai env — build.gradle.kts membaca TF_STORE_*
      # dari environment lebih dulu. Tanpa blok ini secret yang terpasang
      # di repo TIDAK PERNAH sampai ke Gradle dan signing selalu jatuh ke
      # debug key. Secret yang belum diisi = string kosong, dan itu sudah
      # ditangani (dianggap tidak ada).
      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace --no-daemon
        env:
          TF_STORE_BASE64: ${{ secrets.TF_STORE_BASE64 }}
          TF_STORE_PASSWORD: ${{ secrets.TF_STORE_PASSWORD }}
          TF_KEY_ALIAS: ${{ secrets.TF_KEY_ALIAS }}
          TF_KEY_PASSWORD: ${{ secrets.TF_KEY_PASSWORD }}
          TF_STORE_EXT: ${{ secrets.TF_STORE_EXT }}

      # Wiping signing material happens no matter what — sukses atau gagal.
      # `if: always()` guarantees this step runs even when an earlier step
      # failed, so a broken build never leaves the key lying on disk.
      - name: Hapus material signing
        if: always()
        run: |
          rm -rf build/signing
          rm -f keystore.properties signing.properties
          echo "sisa file keystore di runner:"
          find . \( -name "*.p12" -o -name "*.jks" -o -name "*.keystore" -o -name "*.pfx" \) -not -path "./.git/*" || echo "  (tidak ada)"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: trialfetch-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: trialfetch-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Setelah upload supaya temuan lint tetap menggagalkan workflow
      # tanpa menghapus APK yang sudah jadi dari artefak.
      - name: Lint
        run: gradle :app:lintDebug --stacktrace --no-daemon
