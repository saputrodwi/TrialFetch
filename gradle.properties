# --- Signing -------------------------------------------------------------
# Kredensial TIDAK ditaruh di file ini, karena file ini ikut ter-commit —
# begitu diisi, keystore-nya ikut masuk repo. app/build.gradle.kts membaca
# TF_STORE_* dari environment dulu, baru dari gradle properties, jadi
# simpan di salah satu dari dua tempat ini:
#
#   1. Lokal  : ~/.gradle/gradle.properties   (atau -PTF_STORE_… saat build)
#   2. CI     : secret Actions TF_STORE_BASE64 / TF_STORE_PASSWORD /
#               TF_KEY_ALIAS / TF_KEY_PASSWORD / TF_STORE_EXT
#               (dipetakan ke env di .github/workflows/build-apk.yml)
#
# Isi yang dibutuhkan: TF_STORE_PASSWORD, TF_KEY_ALIAS, TF_KEY_PASSWORD,
# plus salah satu TF_STORE_BASE64 (isi keystore di-base64) atau
# TF_STORE_FILE (path file). TF_STORE_EXT default "jks".
# Selama semuanya kosong, build rilis memakai debug key dan memberi
# peringatan keras di log CI.
