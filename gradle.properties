org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# --- Signing -------------------------------------------------------------
# Biarkan kosong kalau belum ingin build rilis — buildType "release" akan
# otomatis memakai debug key supaya pipeline tetap hijau.
#
# Untuk GitHub Actions, lebih aman pakai TF_STORE_BASE64 (isi file .jks
# atau .p12 yang di-base64) daripada TF_STORE_FILE, karena file-nya tidak
# perlu ada di repo sama sekali. Cara menempel secret-nya ada di
# .github/workflows/build-apk.yml
TF_STORE_FILE=
TF_STORE_BASE64=
TF_STORE_EXT=jks
TF_STORE_PASSWORD=
TF_KEY_ALIAS=
TF_KEY_PASSWORD=
