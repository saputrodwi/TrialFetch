# Signing — JANGAN commit file keystore.
# Taruh keystore di root project sebagai: keystore/trial-fetch.p12
# lalu isi password di Signing Secrets pada GitHub Actions, ATAU
# buat file keystore.properties yang sudah masuk .gitignore.
# Lihat app/build.gradle.kts bagian "signingConfigs".
TF_STORE_FILE=
TF_STORE_PASSWORD=
TF_KEY_ALIAS=
TF_KEY_PASSWORD=
